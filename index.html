<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAM LIFT STROY | Электронная визитка</title>
    <style>
        :root {
            --primary-color: #1e3d2f;
            --accent-green: #2e7d32;
            --bg-color: #f4f6f5;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #555555;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 30px 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .logo-container {
            width: 100%;
            max-width: 240px;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-container img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        .company-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .section-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin: 20px 0 10px 0;
            text-align: left;
            font-weight: 600;
        }

        .info-box {
            background: #f9fbfb;
            border-left: 4px solid var(--accent-green);
            padding: 15px;
            border-radius: 0 12px 12px 0;
            text-align: left;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            box-sizing: border-box;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-whatsapp {
            background-color: #25d366;
            color: white;
        }

        .btn-call {
            background-color: var(--primary-color);
            color: white;
        }

        .email-text {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Ваш новый логотип из папки логотип -->
        <div class="logo-container">
            <img src="логотип/logo.jpeg" alt="MAM LIFT STROY Логотип">
        </div>

        <div class="company-subtitle">
            Продажа, монтаж и обслуживание лифтового оборудования
        </div>

        <div class="section-title">О компании</div>
        <div class="info-box">
            Профессиональный монтаж, установка и техническое обслуживание лифтов и подъёмников. Казахстан, Алматы.<br><br>
            <strong>Директор:</strong> Babalhan Togenenov
        </div>

        <div class="section-title">Контакты</div>
        <a href="https://wa.me/77478958350" class="btn btn-whatsapp">Написать в WhatsApp</a>
        <a href="tel:+77478958350" class="btn btn-call">Позвонить</a>
        
        <div class="email-text">
            📧 babalhan@mail.ru
        </div>
    </div>

</body>
</html>
